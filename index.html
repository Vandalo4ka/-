<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Запись к мастеру маникюра</title>

  <style>
    :root {
      --bg: #f3ede5;
      --card: #ffffff;
      --text: #6b4b43;
      --muted: #9d7f78;
      --accent: #c98091;
      --accent-dark: #b86d7f;
      --accent-light: #ead0d5;
      --line: #eadfda;
      --error: #b85d70;
      --shadow: rgba(92, 62, 50, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    .app { width: 100%; max-width: 680px; }

    .avatar {
      width: 74px;
      height: 74px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #f4dce2;
      border: 2px solid #e6b9c4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 34px;
    }

    h1 {
      text-align: center;
      font-weight: 400;
      font-size: 34px;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      font-family: Arial, sans-serif;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 34px;
      font-size: 14px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 0 auto 26px;
      max-width: 440px;
      font-family: Arial, sans-serif;
      color: var(--muted);
      font-size: 12px;
    }

    .step {
      text-align: center;
      position: relative;
    }

    .step::before {
      content: "";
      position: absolute;
      top: 16px;
      left: -50%;
      width: 100%;
      height: 1px;
      background: var(--line);
      z-index: 0;
    }

    .step:first-child::before { display: none; }

    .step-num {
      width: 32px;
      height: 32px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      font-weight: 700;
    }

    .step.active .step-num {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .step.active { color: var(--accent); }

    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 40px var(--shadow);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      margin-bottom: 24px;
    }

    .icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f4dce2;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      font-size: 15px;
      flex: none;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-bottom: 26px;
    }

    .option {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: #fff;
      transition: 0.15s ease;
    }

    .option:hover,
    .option.selected {
      border-color: var(--accent);
      background: #fbf1f3;
    }

    .option-main {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .option-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .form-grid {
      display: grid;
      gap: 14px;
      margin-bottom: 22px;
      font-family: Arial, sans-serif;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 82px;
    }

    input:focus,
    textarea:focus { border-color: var(--accent); }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
    }

    button,
    .tg-button {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: Arial, sans-serif;
      transition: 0.15s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .primary {
      background: var(--accent-light);
      color: #fff;
      cursor: not-allowed;
    }

    .primary.enabled {
      background: var(--accent);
      cursor: pointer;
    }

    .primary.enabled:hover,
    .tg-button:hover {
      background: var(--accent-dark);
    }

    .secondary {
      background: #f7f0ed;
      color: var(--muted);
    }

    .tg-button {
      margin-top: 14px;
      background: var(--accent);
      color: white;
      width: 100%;
    }

    .cancel-button {
      margin-top: 12px;
      background: #f7f0ed;
      color: var(--error);
      width: 100%;
    }

    .cancel-button:hover {
      background: #f3e3e0;
    }

    .error {
      color: var(--error);
      font-family: Arial, sans-serif;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .success {
      text-align: center;
      font-family: Arial, sans-serif;
      line-height: 1.7;
      padding: 20px 0;
    }

    .success-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      margin-bottom: 12px;
    }

    .summary {
      background: #fbf1f3;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }


    .date-strip {
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
      font-family: Arial, sans-serif;
    }

    .month-label {
      font-family: Arial, sans-serif;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .date-list {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(58px, 1fr);
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .date-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      font-family: Arial, sans-serif;
      min-width: 58px;
      transition: 0.15s ease;
    }

    .date-card:hover,
    .date-card.selected {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .date-day {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .date-weekday {
      font-size: 12px;
      color: inherit;
      opacity: 0.85;
    }

    .calendar-arrow {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      padding: 0;
      background: #f7f0ed;
      color: var(--muted);
      cursor: pointer;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .time-chip {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f7f0ed;
      padding: 10px 8px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .time-chip:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .calendar-note {
      font-family: Arial, sans-serif;
      color: var(--muted);
      font-size: 13px;
      margin-top: -6px;
      margin-bottom: 16px;
    }

    .hidden { display: none; }

    @media (max-width: 560px) {
      body { padding: 22px 12px; }
      .card { padding: 24px 18px; }
      h1 { font-size: 30px; }
      .buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="avatar">♡</div>
    <h1>Запись к Светлане</h1>
    <div class="subtitle">Мастер маникюра и педикюра</div>

    <div class="steps">
      <div class="step active" id="step1"><div class="step-num">1</div><div>Услуга</div></div>
      <div class="step" id="step2"><div class="step-num">2</div><div>Дата</div></div>
      <div class="step" id="step3"><div class="step-num">3</div><div>Время</div></div>
      <div class="step" id="step4"><div class="step-num">4</div><div>Готово</div></div>
    </div>

    <section class="card">
      <div class="card-title">
        <span class="icon" id="cardIcon">♡</span>
        <span id="cardTitle">Выберите услугу</span>
      </div>

      <div id="error" class="error hidden"></div>
      <div id="content"></div>

      <div class="buttons" id="buttons">
        <button class="secondary hidden" id="backBtn">Назад</button>
        <button class="primary hidden" id="nextBtn">Далее →</button>
      </div>
    </section>
  </main>

  <script>
    const state = {
      step: 1,
      services: [],
      dates: [],
      slots: [],
      selectedService: null,
      selectedDate: null,
      selectedTime: null,
      clientName: "",
      notes: "",
      visibleDateStart: 0
    };

    const content = document.getElementById("content");
    const errorBox = document.getElementById("error");
    const nextBtn = document.getElementById("nextBtn");
    const backBtn = document.getElementById("backBtn");
    const cardTitle = document.getElementById("cardTitle");
    const cardIcon = document.getElementById("cardIcon");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.add("hidden");
    }

    async function api(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => null);

      if (!response.ok) {
        throw new Error(data?.detail || "Ошибка сервера");
      }

      return data;
    }

    function updateSteps() {
      [1, 2, 3, 4].forEach((n) => {
        document.getElementById(`step${n}`).classList.toggle("active", n === state.step);
      });
    }

    function setNextEnabled(enabled) {
      nextBtn.disabled = !enabled;
      nextBtn.classList.toggle("enabled", enabled);
    }

    function goToStep(step) {
      state.step = step;
      updateSteps();

      if (step === 1) renderServices();
      if (step === 2) renderDates();
      if (step === 3) renderSlots();
      if (step === 4) renderClientForm();
    }

    function renderOptionList(items, selectedValue, valueKey, titleFn, metaFn = null) {
      return `
        <div class="options">
          ${items.map((item) => {
            const value = item[valueKey];
            const selected = value === selectedValue ? "selected" : "";
            const meta = metaFn ? `<div class="option-meta">${metaFn(item)}</div>` : "";

            return `
              <div class="option ${selected}" data-value="${value}">
                <div class="option-main">${titleFn(item)}</div>
                ${meta}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    async function renderServices() {
      clearError();
      cardTitle.textContent = "Выберите услугу";
      cardIcon.textContent = "♡";
      content.innerHTML = "Загрузка услуг...";
      backBtn.classList.add("hidden");
      nextBtn.classList.add("hidden");
      setNextEnabled(false);

      try {
        state.services = await api("/api/services");

        if (!state.services.length) {
          content.innerHTML = "";
          showError("В таблице нет активных услуг.");
          return;
        }

        content.innerHTML = renderOptionList(
          state.services,
          state.selectedService?.service_id,
          "service_id",
          (item) => `<span>${item.name}</span><span>${item.price} €</span>`,
          (item) => `${item.duration_min} минут`
        );

        document.querySelectorAll(".option").forEach((el) => {
          el.onclick = () => {
            state.selectedService = state.services.find((s) => s.service_id === el.dataset.value);
            state.selectedDate = null;
            state.selectedTime = null;
            goToStep(2);
          };
        });
      } catch (error) {
        content.innerHTML = "";
        showError("Не удалось загрузить услуги. " + error.message);
      }
    }


    function parseDateISO(dateText) {
      const parts = String(dateText).split("-");
      if (parts.length !== 3) return null;

      const year = Number(parts[0]);
      const month = Number(parts[1]) - 1;
      const day = Number(parts[2]);

      if (!year || month < 0 || !day) return null;

      return new Date(year, month, day);
    }

    function formatWeekday(dateText) {
      const date = parseDateISO(dateText);
      if (!date) return "";

      const weekdays = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
      return weekdays[date.getDay()];
    }

    function formatDay(dateText) {
      const date = parseDateISO(dateText);
      if (!date) return dateText;

      return String(date.getDate());
    }

    function formatMonth(dateText) {
      const date = parseDateISO(dateText);
      if (!date) return "";

      const months = [
        "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
        "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
      ];

      return months[date.getMonth()];
    }

    function visibleDates() {
      return state.dates.slice(state.visibleDateStart, state.visibleDateStart + 7);
    }

    async function renderDates() {
      clearError();
      cardTitle.textContent = "Выберите дату";
      cardIcon.textContent = "📅";
      content.innerHTML = "Загрузка дат...";
      backBtn.classList.remove("hidden");
      nextBtn.classList.add("hidden");
      setNextEnabled(false);

      try {
        state.dates = await api("/api/dates");

        if (!state.dates.length) {
          content.innerHTML = "";
          showError("Свободных дат пока нет.");
          return;
        }

        if (state.visibleDateStart >= state.dates.length) {
          state.visibleDateStart = 0;
        }

        const datesToShow = visibleDates();
        const monthLabel = datesToShow.length ? formatMonth(datesToShow[0]) : "";

        content.innerHTML = `
          <div class="month-label">${monthLabel}</div>

          <div class="date-strip">
            <button class="calendar-arrow" id="prevDates" ${state.visibleDateStart === 0 ? "disabled" : ""}>‹</button>

            <div class="date-list">
              ${datesToShow.map((date) => `
                <div class="date-card ${date === state.selectedDate ? "selected" : ""}" data-value="${date}">
                  <div class="date-day">${formatDay(date)}</div>
                  <div class="date-weekday">${formatWeekday(date)}</div>
                </div>
              `).join("")}
            </div>

            <button class="calendar-arrow" id="nextDates" ${state.visibleDateStart + 7 >= state.dates.length ? "disabled" : ""}>›</button>
          </div>

          <div class="calendar-note">Выберите дату, затем свободное время.</div>
        `;

        document.querySelectorAll(".date-card").forEach((el) => {
          el.onclick = () => {
            state.selectedDate = el.dataset.value;
            state.selectedTime = null;
            goToStep(3);
          };
        });

        document.getElementById("prevDates").onclick = () => {
          state.visibleDateStart = Math.max(0, state.visibleDateStart - 7);
          renderDates();
        };

        document.getElementById("nextDates").onclick = () => {
          state.visibleDateStart = Math.min(state.dates.length - 1, state.visibleDateStart + 7);
          renderDates();
        };
      } catch (error) {
        content.innerHTML = "";
        showError("Не удалось загрузить даты. " + error.message);
      }
    }

    async function renderSlots() {
      clearError();
      cardTitle.textContent = "Выберите время";
      cardIcon.textContent = "🕒";
      content.innerHTML = "Загрузка времени...";
      backBtn.classList.remove("hidden");
      nextBtn.classList.add("hidden");
      setNextEnabled(false);

      try {
        state.slots = await api(`/api/slots?date=${encodeURIComponent(state.selectedDate)}`);

        if (!state.slots.length) {
          content.innerHTML = "";
          showError("На эту дату нет свободного времени.");
          return;
        }

        content.innerHTML = `
          <div class="summary">
            <b>Дата:</b> ${state.selectedDate}
          </div>

          <div class="time-grid">
            ${state.slots.map((item) => `
              <div class="time-chip" data-value="${item.time}">${item.time}</div>
            `).join("")}
          </div>
        `;

        document.querySelectorAll(".time-chip").forEach((el) => {
          el.onclick = () => {
            state.selectedTime = el.dataset.value;
            goToStep(4);
          };
        });
      } catch (error) {
        content.innerHTML = "";
        showError("Не удалось загрузить время. " + error.message);
      }
    }

    function renderClientForm() {
      clearError();
      cardTitle.textContent = "Ваши данные";
      cardIcon.textContent = "✓";
      backBtn.classList.remove("hidden");
      nextBtn.classList.remove("hidden");
      nextBtn.textContent = "Записаться";
      setNextEnabled(true);

      content.innerHTML = `
        <div class="summary">
          <b>Услуга:</b> ${state.selectedService.name}<br>
          <b>Дата:</b> ${state.selectedDate}<br>
          <b>Время:</b> ${state.selectedTime}
        </div>

        <div class="form-grid">
          <input id="clientName" placeholder="Ваше имя" value="${state.clientName}">
          <textarea id="notes" placeholder="Комментарий, если нужно">${state.notes}</textarea>
        </div>
      `;

      document.getElementById("clientName").oninput = (e) => state.clientName = e.target.value;
      document.getElementById("notes").oninput = (e) => state.notes = e.target.value;
    }


    async function cancelBooking(bookingId) {
      const confirmed = confirm("Отменить запись? Это действие освободит время для других клиентов.");

      if (!confirmed) {
        return;
      }

      try {
        const result = await api("/api/bookings/cancel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ booking_id: bookingId })
        });

        content.innerHTML = `
          <div class="success">
            <div class="success-title">Запись отменена</div>
            <div>
              Номер записи: ${result.booking_id}<br><br>
              Это время снова доступно для записи.
            </div>
          </div>
        `;
      } catch (error) {
        showError("Не удалось отменить запись. " + error.message);
      }
    }

    async function submitBooking() {
      clearError();

      const name = document.getElementById("clientName")?.value.trim();
      const notes = document.getElementById("notes")?.value.trim();

      if (!name) {
        showError("Введите имя.");
        return;
      }

      nextBtn.textContent = "Отправляем...";
      nextBtn.disabled = true;

      try {
        const result = await api("/api/bookings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            client_name: name,
            notes,
            service_id: state.selectedService.service_id,
            date: state.selectedDate,
            time: state.selectedTime
          })
        });

        state.step = 4;
        updateSteps();
        cardTitle.textContent = "Запись создана";
        cardIcon.textContent = "✓";

        const telegramButton = result.telegram_reminder_url
          ? `<a class="tg-button" href="${result.telegram_reminder_url}" target="_blank" rel="noopener">Получить напоминание в Telegram</a>`
          : "";

        content.innerHTML = `
          <div class="success">
            <div class="success-title">Вы записаны</div>
            <div>
              <b>${result.service_name}</b><br>
              ${result.date}, ${result.time}<br><br>
              Номер записи: ${result.booking_id}
            </div>

            <div class="summary" style="text-align: left;">
              <b>Если нужно отменить запись позже:</b><br>
              сохраните эту ссылку или сделайте скриншот экрана.
              <br><br>
              <a href="${result.cancel_url}" target="_blank" rel="noopener">Открыть страницу отмены записи</a>
            </div>

            <div class="summary" style="margin-top: 22px; text-align: left;">
              <b>Чтобы не забыть:</b><br>
              добавьте запись в календарь или сделайте скриншот этого экрана.
            </div>

            <div class="summary" style="text-align: left;">
              <b>Хотите напоминание за сутки?</b><br>
              Нажмите кнопку ниже, откройте Telegram-бота и нажмите Start.
              ${telegramButton}
            </div>
          </div>
        `;

        document.getElementById("buttons").classList.add("hidden");
      } catch (error) {
        nextBtn.textContent = "Записаться";
        nextBtn.disabled = false;
        setNextEnabled(true);
        showError("Не удалось создать запись. " + error.message);
      }
    }

    nextBtn.onclick = () => {
      if (state.step === 4) submitBooking();
    };

    backBtn.onclick = () => {
      if (state.step > 1) goToStep(state.step - 1);
    };

    goToStep(1);
  </script>
</body>
</html>
