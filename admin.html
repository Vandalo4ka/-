<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админка мастера</title>
  <style>
    :root{
      --green:#1f4b45;--green-dark:#153833;--cream:#f6f2eb;--card:#fffdf9;--line:#e8dccd;--peach:#d6a08d;--muted:#7a7a7a;--text:#24322f;
      --free:#eff8f2;--blocked:#fff0f0;--booked:#faf1ea;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);font-family:Arial,Helvetica,sans-serif;color:var(--text);padding:18px}
    .app{max-width:1280px;margin:0 auto}
    .header{background:var(--green);color:#fff;border-radius:24px;padding:22px 20px;margin-bottom:18px}
    .header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:34px}
    .header p{margin:8px 0 0;font-size:15px;opacity:.92}
    .card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 16px 34px rgba(0,0,0,.08)}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .date-list{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
    .date-btn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 10px;cursor:pointer;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
    .date-btn strong{display:block;font-size:24px;color:#5b4339}
    .date-btn span{display:block;font-size:13px;color:#8a6b5f;margin-top:4px}
    .date-btn.active{background:#fef4ef;border-color:var(--peach)} .date-btn:hover{border-color:var(--peach);background:#fffaf6} .date-btn .mini{font-size:12px;color:var(--muted);line-height:1.35;margin-top:8px}.week-nav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}.week-title{font-weight:700;color:#5b4339}
    .toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
    button{font-family:inherit}
    .btn{border:none;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}
    .btn-primary{background:var(--peach);color:#fff}.btn-secondary{background:#efe8df;color:#5b4339}.btn-outline{background:#fff;border:1px solid var(--line);color:#5b4339}
    .slots{display:grid;gap:10px}
    .week-board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
    .week-day-card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:10px;min-width:0}
    .week-day-title{font-family:Georgia,'Times New Roman',serif;font-size:24px;color:#5b4339;margin:0}
    .week-day-subtitle{font-size:12px;color:var(--muted);margin:2px 0 10px}
    .week-slot{border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:8px;font-size:12px;line-height:1.3}
    .week-slot.free{background:var(--free)} .week-slot.blocked{background:var(--blocked)} .week-slot.booked{background:var(--booked)}
    .week-slot-time{font-size:17px;font-weight:700;color:#5b4339;margin-bottom:5px}
    .week-slot-client{font-weight:700;color:#5b4339}
    .week-slot-service{margin-top:3px;color:#5a514d}
    .week-slot-price{margin-top:3px;font-weight:700;color:#5b4339}
    .week-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
    .week-actions .btn{font-size:11px;padding:8px 9px;border-radius:10px}
    .day-sheet{border:1px solid var(--line);border-radius:22px;background:#fff;padding:18px;margin-top:12px}.day-title{font-family:Georgia,'Times New Roman',serif;font-size:30px;color:#5b4339;margin:0 0 14px}.day-subtitle{color:var(--muted);font-size:14px;margin-top:-8px;margin-bottom:16px}.slot-list{display:grid;gap:10px}
    .slot{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center}
    .slot.free{background:var(--free)} .slot.blocked{background:var(--blocked)} .slot.booked{background:var(--booked)}
    .slot-top{display:block}
    .time{font-size:22px;font-weight:700;color:#5b4339}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .badge.free{background:#dceede;color:#32664b}.badge.blocked{background:#f8dede;color:#a14f4f}.badge.booked{background:#f4ddd0;color:#7c4d3b}
    .meta{margin-top:0;line-height:1.45;color:#5a514d}.record-line{font-size:16px}.record-line b{color:#5b4339}.service-line{margin-top:4px;color:#6b5d55}.price-line{margin-top:4px;font-weight:700;color:#5b4339}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:0}
    .hidden{display:none}.muted{color:var(--muted)}.error{color:#b95f5f;margin-bottom:12px;line-height:1.45}
    .empty{padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
    .move-panel{padding:14px 16px;border:1px solid var(--peach);border-radius:16px;background:#fff7f2;margin:12px 0 16px;line-height:1.5}
    .move-panel b{color:#5b4339}.service-price-row{display:grid;grid-template-columns:1.5fr 80px 80px 1.4fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.service-price-row:last-child{border-bottom:none}.service-price-name{font-weight:700;color:#5b4339}.price-input,.service-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px;background:#fff}.services-add-box{display:grid;grid-template-columns:1.5fr 80px 80px 1.4fr auto;gap:10px;align-items:center;margin:14px 0;padding:12px;border:1px dashed var(--line);border-radius:16px;background:#fff}.small-label{font-size:12px;color:var(--muted);margin-bottom:4px}@media(max-width:640px){.service-price-row,.services-add-box{grid-template-columns:1fr}.service-price-row button,.services-add-box button{width:100%}.week-board{grid-template-columns:repeat(5,minmax(190px,1fr));overflow-x:auto}.week-day-card{min-width:190px}}
    @media (max-width:640px){ .header h1{font-size:28px}.date-list{grid-template-columns:repeat(5,minmax(86px,1fr));overflow-x:auto}.date-btn{min-width:86px}.card{padding:14px}.slot{grid-template-columns:1fr;align-items:start}.actions{justify-content:flex-start}.time{font-size:24px} }
  </style>
</head>
<body>
<div class="app">
  <section class="header">
    <h1>Админка мастера</h1>
    <p>С телефона можно смотреть записи, закрывать время, открывать его обратно и отменять записи.</p>
  </section>

  <section class="card">
    <div class="error hidden" id="errorBox"></div>
    <div class="row" style="justify-content:space-between;align-items:end">
      <div>
        <div class="muted">Дата</div>
        <div id="selectedDateTitle" style="font-size:24px;font-weight:700;color:#5b4339;margin-top:4px">—</div>
      </div>
      <div>
        <button class="btn btn-outline" id="reloadBtn">Обновить</button>
      </div>
    </div>

    <div class="week-nav">
      <button class="btn btn-outline" id="prevWeekBtn">‹ неделя</button>
      <div class="week-title" id="weekTitle">Неделя</div>
      <button class="btn btn-outline" id="nextWeekBtn">неделя ›</button>
    </div>
    <div class="date-list" id="dateList"></div>

    <div class="toolbar">
      <button class="btn btn-primary" id="addSlotBtn">Добавить свободное время</button>
      <button class="btn btn-outline" id="servicesBtn">Цены на услуги</button>
      <button class="btn btn-secondary" id="closeDayBtn">Закрыть весь день</button>
      <button class="btn btn-outline" id="openDayBtn">Открыть весь день</button>
    </div>

    <div id="movePanel" class="move-panel hidden"></div>
    <div id="servicesPanel" class="move-panel hidden"></div>

    <div id="slotsWrap" class="slots"></div>
  </section>
</div>

<script>
const state = { dates: [], selectedDate: '', adminKey: '', movingBooking: null, weekStart: '' };
const params = new URLSearchParams(location.search);
state.adminKey = params.get('key') || localStorage.getItem('admin_key') || '';
if(params.get('key')) localStorage.setItem('admin_key', state.adminKey);

const errorBox = document.getElementById('errorBox');
const dateList = document.getElementById('dateList');
const selectedDateTitle = document.getElementById('selectedDateTitle');
const slotsWrap = document.getElementById('slotsWrap');
const servicesPanel = document.getElementById('servicesPanel');
const weekTitle = document.getElementById('weekTitle');
const prevWeekBtn = document.getElementById('prevWeekBtn');
const nextWeekBtn = document.getElementById('nextWeekBtn');

document.getElementById('reloadBtn').onclick = () => loadSchedule();
document.getElementById('addSlotBtn').onclick = () => addFreeSlot();
document.getElementById('servicesBtn').onclick = () => toggleServicesPanel();
document.getElementById('closeDayBtn').onclick = () => updateDay('close-day');
document.getElementById('openDayBtn').onclick = () => updateDay('open-day');
prevWeekBtn.onclick = () => shiftWeek(-7);
nextWeekBtn.onclick = () => shiftWeek(7);

function showError(text){ errorBox.textContent=text; errorBox.classList.remove('hidden'); }
function clearError(){ errorBox.textContent=''; errorBox.classList.add('hidden'); }
function q(url){ return state.adminKey ? url + (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(state.adminKey) : url; }
function api(url, options={}){ return fetch(q(url), options).then(async res => { const data = await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.detail || 'Ошибка сервера'); return data;}); }
function dayNum(dateText){ return new Date(dateText+'T00:00:00').getDate(); }
function dayLabel(dateText){ return new Date(dateText+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'short'}).replace('.', ''); }
function prettyDate(dateText){ return new Date(dateText+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'long', day:'numeric', month:'long'}); }

function toISODate(d){
  const copy = new Date(d);
  copy.setHours(0,0,0,0);
  const y = copy.getFullYear();
  const m = String(copy.getMonth()+1).padStart(2,'0');
  const day = String(copy.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function mondayOf(dateText){
  const d = new Date(dateText + 'T00:00:00');
  const day = d.getDay(); // 0 Sun, 1 Mon
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return toISODate(d);
}

function addDays(dateText, days){
  const d = new Date(dateText + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return toISODate(d);
}

function weekDates(){
  if(!state.weekStart){
    state.weekStart = mondayOf(state.selectedDate || state.dates[0] || toISODate(new Date()));
  }
  return [0,1,2,3,4].map(offset => addDays(state.weekStart, offset));
}

function shiftWeek(days){
  state.weekStart = addDays(state.weekStart, days);
  const dates = weekDates();
  state.selectedDate = dates[0];
  renderDates();
  loadSchedule();
}

function monthDay(dateText){
  return new Date(dateText + 'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric', month:'short'}).replace('.', '');
}

function todayISO(){
  return toISODate(new Date());
}

function isWeekdayDate(dateText){
  const d = new Date(dateText + 'T00:00:00');
  const day = d.getDay();
  return day >= 1 && day <= 5;
}


async function loadDates(){
  clearError();
  const dates = await api('/api/admin/dates');
  state.dates = dates;
  const today = todayISO();

  // Админка всегда открывается на текущей неделе.
  if(!state.weekStart){
    state.weekStart = mondayOf(today);
  }

  if(!state.selectedDate){
    state.selectedDate = isWeekdayDate(today) ? today : state.weekStart;
  }

  renderDates();
}

function renderDates(){
  const dates = weekDates();
  const available = new Set(state.dates);
  const first = dates[0];
  const last = dates[dates.length - 1];

  weekTitle.textContent = monthDay(first) + ' — ' + monthDay(last);

  dateList.innerHTML = dates.map(date => {
    const hasSlots = available.has(date);
    return `
      <button class="date-btn ${state.selectedDate===date?'active':''}" data-date="${date}">
        <div>
          <strong>${dayNum(date)}</strong>
          <span>${dayLabel(date)}</span>
        </div>
        <div class="mini">${hasSlots ? 'есть слоты' : 'посмотреть день'}</div>
      </button>`;
  }).join('');

  document.querySelectorAll('.date-btn').forEach(btn => {
    btn.onclick = () => {
      state.selectedDate = btn.dataset.date;
      renderDates();
      loadSchedule();
    };
  });
}

async function loadSchedule(){
  clearError();

  const dates = weekDates();
  selectedDateTitle.textContent = 'Неделя: ' + monthDay(dates[0]) + ' — ' + monthDay(dates[4]);
  slotsWrap.innerHTML = '<div class="empty">Загрузка недели...</div>';

  try {
    const schedules = await Promise.all(
      dates.map(date =>
        api('/api/admin/schedule?date=' + encodeURIComponent(date))
          .then(data => ({date, items: data.items || []}))
          .catch(error => ({date, items: [], error: error.message}))
      )
    );

    const board = schedules.map(day => {
      const itemsHtml = day.items.length ? day.items.map(item => renderWeekSlot(day.date, item)).join('') : '<div class="empty">Нет слотов</div>';

      return `
        <div class="week-day-card ${state.selectedDate===day.date ? 'active' : ''}" data-date="${day.date}">
          <h2 class="week-day-title">${dayNum(day.date)}</h2>
          <div class="week-day-subtitle">${dayLabel(day.date)}, ${prettyDate(day.date)}</div>
          ${itemsHtml}
        </div>
      `;
    }).join('');

    slotsWrap.innerHTML = `<div class="week-board">${board}</div>`;

    bindScheduleButtons();
    renderMovePanel();
  } catch(e){
    showError(e.message);
    slotsWrap.innerHTML = '<div class="empty">Не удалось загрузить неделю.</div>';
  }
}

function renderWeekSlot(date, item){
  let badge = '';
  let detail = '';
  let actions = '';

  if(item.type === 'free'){
    badge = '<span class="badge free">свободно</span>';
    detail = `
      <div class="week-slot-client">Свободно</div>
      <div class="week-slot-service">Можно записать клиента</div>
    `;

    if(state.movingBooking){
      actions = `
        <button class="btn btn-primary moveHereBtn" data-date="${date}" data-time="${item.time}">Сюда</button>
        <button class="btn btn-primary createBookingBtn" data-date="${date}" data-time="${item.time}">Записать</button>
        <button class="btn btn-outline changeTimeBtn" data-date="${date}" data-time="${item.time}">Время</button>
        <button class="btn btn-secondary actionBtn" data-date="${date}" data-action="block" data-time="${item.time}">Закрыть</button>
      `;
    } else {
      actions = `
        <button class="btn btn-primary createBookingBtn" data-date="${date}" data-time="${item.time}">Записать</button>
        <button class="btn btn-outline changeTimeBtn" data-date="${date}" data-time="${item.time}">Время</button>
        <button class="btn btn-secondary actionBtn" data-date="${date}" data-action="block" data-time="${item.time}">Закрыть</button>
      `;
    }
  } else if(item.type === 'blocked'){
    badge = '<span class="badge blocked">закрыто</span>';
    detail = `
      <div class="week-slot-client">Закрыто</div>
      <div class="week-slot-service">Клиенты не видят это время</div>
    `;
    actions = `<button class="btn btn-outline actionBtn" data-date="${date}" data-action="unblock" data-time="${item.time}">Открыть</button>`;
  } else {
    badge = '<span class="badge booked">запись</span>';
    detail = `
      <div class="week-slot-client">${item.client_name || 'Клиент'}</div>
      <div class="week-slot-service">${item.service_name || 'Услуга не указана'}</div>
      ${item.price ? `<div class="week-slot-price">${item.price}</div>` : ''}
      ${item.notes ? `<div class="week-slot-service">Комм.: ${item.notes}</div>` : ''}
    `;
    actions = `
      <button class="btn btn-outline selectMoveBtn"
        data-booking-id="${item.booking_id || ''}"
        data-date="${date}"
        data-time="${item.time}"
        data-client="${item.client_name || ''}"
        data-service="${item.service_name || ''}">
        Перенести
      </button>
      <button class="btn btn-primary actionBtn" data-date="${date}" data-action="cancel" data-time="${item.time}">Отменить</button>
    `;
  }

  return `
    <div class="week-slot ${item.type}">
      <div class="week-slot-time">${item.time}</div>
      ${badge}
      ${detail}
      <div class="week-actions">${actions}</div>
    </div>
  `;
}

function bindScheduleButtons(){
  document.querySelectorAll('.actionBtn').forEach(btn => {
    btn.onclick = () => {
      state.selectedDate = btn.dataset.date || state.selectedDate;
      renderDates();
      runAction(btn.dataset.action, btn.dataset.time);
    };
  });

  document.querySelectorAll('.selectMoveBtn').forEach(btn => {
    btn.onclick = () => {
      state.selectedDate = btn.dataset.date || state.selectedDate;
      renderDates();
      startMoveBooking({
        bookingId: btn.dataset.bookingId,
        date: btn.dataset.date,
        time: btn.dataset.time,
        client: btn.dataset.client,
        service: btn.dataset.service
      });
    };
  });

  document.querySelectorAll('.moveHereBtn').forEach(btn => {
    btn.onclick = () => {
      state.selectedDate = btn.dataset.date || state.selectedDate;
      renderDates();
      moveBookingHere(btn.dataset.date, btn.dataset.time);
    };
  });

  document.querySelectorAll('.changeTimeBtn').forEach(btn => {
    btn.onclick = () => {
      state.selectedDate = btn.dataset.date || state.selectedDate;
      renderDates();
      changeFreeSlotTime(btn.dataset.time);
    };
  });

  document.querySelectorAll('.createBookingBtn').forEach(btn => {
    btn.onclick = () => {
      state.selectedDate = btn.dataset.date || state.selectedDate;
      renderDates();
      createBookingInFreeSlot(btn.dataset.time);
    };
  });
}

async function toggleServicesPanel(){
  clearError();

  if(!servicesPanel.classList.contains('hidden')){
    servicesPanel.classList.add('hidden');
    servicesPanel.innerHTML = '';
    return;
  }

  servicesPanel.classList.remove('hidden');
  servicesPanel.innerHTML = '<b>Услуги и цены</b><br><span class="muted">Загрузка...</span>';

  await renderServicesPanel();
}

async function renderServicesPanel(){
  try {
    const services = await api('/api/admin/services');

    servicesPanel.innerHTML = `
      <b>Услуги и цены</b>
      <div class="services-add-box">
        <div>
          <div class="small-label">Новая услуга</div>
          <input class="service-input" id="newServiceName" placeholder="Название">
        </div>
        <div>
          <div class="small-label">Минуты</div>
          <input class="service-input" id="newServiceDuration" placeholder="60">
        </div>
        <div>
          <div class="small-label">Цена</div>
          <input class="service-input" id="newServicePrice" placeholder="40">
        </div>
        <div>
          <div class="small-label">Описание</div>
          <input class="service-input" id="newServiceDescription" placeholder="Короткое описание">
        </div>
        <button class="btn btn-primary" id="createServiceBtn">Добавить</button>
      </div>

      <div style="margin-top:10px">
        ${services.length ? services.map(service => `
          <div class="service-price-row" data-service-id="${service.service_id}">
            <div>
              <div class="small-label">Название</div>
              <input class="service-input service-name-input" data-service-id="${service.service_id}" value="${escapeHtml(service.name || '')}">
            </div>
            <div>
              <div class="small-label">Минуты</div>
              <input class="service-input service-duration-input" data-service-id="${service.service_id}" value="${escapeHtml(service.duration_min || '')}">
            </div>
            <div>
              <div class="small-label">Цена</div>
              <input class="price-input service-price-input" data-service-id="${service.service_id}" value="${escapeHtml(service.price || '')}">
            </div>
            <div>
              <div class="small-label">Описание</div>
              <input class="service-input service-description-input" data-service-id="${service.service_id}" value="${escapeHtml(service.description || '')}">
            </div>
            <button class="btn btn-primary saveServiceBtn" data-service-id="${service.service_id}">Сохранить</button>
            <button class="btn btn-secondary deleteServiceBtn" data-service-id="${service.service_id}">Удалить</button>
          </div>
        `).join('') : '<div class="muted">Услуги не найдены.</div>'}
      </div>
    `;

    document.getElementById('createServiceBtn').onclick = createService;

    document.querySelectorAll('.saveServiceBtn').forEach(btn => {
      btn.onclick = () => saveService(btn.dataset.serviceId);
    });

    document.querySelectorAll('.deleteServiceBtn').forEach(btn => {
      btn.onclick = () => deleteService(btn.dataset.serviceId);
    });

  } catch(e){
    showError('Не удалось загрузить услуги. ' + e.message);
  }
}

function escapeHtml(value){
  return String(value || '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

async function saveService(serviceId){
  clearError();

  const name = document.querySelector(`.service-name-input[data-service-id="${serviceId}"]`)?.value.trim() || '';
  const duration = document.querySelector(`.service-duration-input[data-service-id="${serviceId}"]`)?.value.trim() || '';
  const price = document.querySelector(`.service-price-input[data-service-id="${serviceId}"]`)?.value.trim() || '';
  const description = document.querySelector(`.service-description-input[data-service-id="${serviceId}"]`)?.value.trim() || '';

  if(!name || !duration || !price){
    showError('Заполните название, длительность и цену.');
    return;
  }

  try {
    await api('/api/admin/services/update', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        service_id: serviceId,
        name,
        duration_min: duration,
        price,
        description,
        is_active: 'TRUE'
      })
    });

    await renderServicesPanel();
  } catch(e){
    showError('Не удалось сохранить услугу. ' + e.message);
  }
}

async function createService(){
  clearError();

  const name = document.getElementById('newServiceName').value.trim();
  const duration = document.getElementById('newServiceDuration').value.trim();
  const price = document.getElementById('newServicePrice').value.trim();
  const description = document.getElementById('newServiceDescription').value.trim();

  if(!name || !duration || !price){
    showError('Заполните название, длительность и цену новой услуги.');
    return;
  }

  try {
    await api('/api/admin/services/create', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name,
        duration_min: duration,
        price,
        description
      })
    });

    await renderServicesPanel();
  } catch(e){
    showError('Не удалось добавить услугу. ' + e.message);
  }
}

async function deleteService(serviceId){
  clearError();

  if(!confirm('Удалить услугу? Она будет скрыта с клиентской страницы, но останется в Google Sheets как inactive.')) return;

  try {
    await api('/api/admin/services/delete', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ service_id: serviceId })
    });

    await renderServicesPanel();
  } catch(e){
    showError('Не удалось удалить услугу. ' + e.message);
  }
}

async function addFreeSlot(){
  clearError();

  if(!state.selectedDate){
    showError('Сначала выберите дату.');
    return;
  }

  const time = prompt('Введите новое свободное время в формате HH:MM, например 14:00:');
  if(!time || !time.trim()) return;

  if(!confirm('Добавить свободное время ' + time.trim() + ' на ' + state.selectedDate + '?')) return;

  try {
    await api('/api/admin/add-free-slot', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        date: state.selectedDate,
        time: time.trim()
      })
    });

    await loadDates();
    loadSchedule();
  } catch(e){
    showError('Не удалось добавить свободное время. ' + e.message);
  }
}

async function createBookingInFreeSlot(time){
  clearError();

  const clientName = prompt('Имя клиента:');
  if(!clientName || !clientName.trim()) return;

  const serviceName = prompt('Услуга, например: маникюр / педикюр / ресницы:', '');
  if(!serviceName || !serviceName.trim()) return;

  const notes = prompt('Комментарий, если нужен:', '') || '';

  if(!confirm('Записать клиента ' + clientName.trim() + ' на ' + state.selectedDate + ' в ' + time + '?')) return;

  try {
    await api('/api/admin/create-booking', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        date: state.selectedDate,
        time: time,
        client_name: clientName.trim(),
        service_name: serviceName.trim(),
        notes: notes.trim()
      })
    });

    await loadDates();
    loadSchedule();
  } catch(e){
    showError('Не удалось записать клиента. ' + e.message);
  }
}

async function changeFreeSlotTime(oldTime){
  clearError();

  const newTime = prompt('Введите новое время в формате HH:MM:', oldTime);
  if(!newTime) return;

  if(newTime.trim() === oldTime){
    return;
  }

  if(!confirm('Изменить свободное время ' + oldTime + ' на ' + newTime.trim() + '?')) return;

  try {
    await api('/api/admin/change-free-time', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        date: state.selectedDate,
        old_time: oldTime,
        new_time: newTime.trim()
      })
    });

    await loadDates();
    loadSchedule();
  } catch(e){
    showError('Не удалось изменить время. ' + e.message);
  }
}

function startMoveBooking(booking){
  clearError();

  if(!booking.date || !booking.time){
    showError('Не найдена дата или время записи.');
    return;
  }

  state.movingBooking = booking;
  renderMovePanel();
  loadSchedule();
}

function cancelMoveMode(){
  state.movingBooking = null;
  renderMovePanel();
  loadSchedule();
}

function renderMovePanel(){
  const panel = document.getElementById('movePanel');
  if(!panel) return;

  if(!state.movingBooking){
    panel.classList.add('hidden');
    panel.innerHTML = '';
    return;
  }

  panel.classList.remove('hidden');
  panel.innerHTML = `
    <b>Режим переноса записи</b><br>
    ${state.movingBooking.client || 'Клиент'} — ${state.movingBooking.service || ''}<br>
    Сейчас: ${state.movingBooking.date}, ${state.movingBooking.time}<br>
    Выберите любую свободную дату и нажмите <b>“Перенести сюда”</b>.
    <div style="margin-top:10px">
      <button class="btn btn-outline" id="cancelMoveModeBtn">Отменить перенос</button>
    </div>
  `;

  document.getElementById('cancelMoveModeBtn').onclick = cancelMoveMode;
}

async function moveBookingHere(newDate, newTime){
  clearError();

  if(!state.movingBooking){
    showError('Сначала выберите запись, которую нужно перенести.');
    return;
  }

  if(!confirm('Перенести запись на ' + newDate + ' в ' + newTime + '?')) return;

  try {
    await api('/api/admin/move-booking', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        booking_id: state.movingBooking.bookingId || '',
        old_date: state.movingBooking.date,
        old_time: state.movingBooking.time,
        new_date: newDate,
        new_time: newTime
      })
    });

    alert('Запись перенесена.');
    state.movingBooking = null;
    await loadDates();
    state.selectedDate = newDate;
    state.weekStart = mondayOf(newDate);
    renderDates();
    loadSchedule();
  } catch(e){
    showError('Не удалось перенести запись. ' + e.message);
  }
}

async function runAction(action, time){
  clearError();
  const labels = {block:'закрыть это время', unblock:'открыть это время', cancel:'отменить запись'};
  if(!confirm('Точно ' + labels[action] + '?')) return;
  const map = { block:'/api/admin/block', unblock:'/api/admin/unblock', cancel:'/api/admin/cancel-slot' };
  try {
    await api(map[action], {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({date: state.selectedDate, time})});
    loadSchedule();
  } catch(e){ showError(e.message); }
}

async function updateDay(kind){
  clearError();
  const label = kind === 'close-day' ? 'закрыть весь день' : 'открыть весь день';
  if(!confirm('Точно ' + label + '?')) return;
  try {
    await api('/api/admin/' + kind, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({date: state.selectedDate})});
    loadSchedule();
  } catch(e){ showError(e.message); }
}

loadDates().then(loadSchedule).catch(e => showError(e.message));
</script>
</body>
</html>
